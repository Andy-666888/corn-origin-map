<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玉米产地分布地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;height:100vh;overflow:hidden;background:#f0f2f5}
/* 左侧面板 */
#leftPanel{width:340px;min-width:340px;background:#fff;display:flex;flex-direction:column;height:100vh;box-shadow:2px 0 12px rgba(0,0,0,.08);z-index:1000;transition:margin-left .3s}
#leftPanel.collapsed{margin-left:-340px}
.panel-header{padding:16px 18px 12px;border-bottom:1px solid #e5e7eb}
.panel-header h2{font-size:17px;font-weight:700;color:#1a1a2e}
.panel-header p{font-size:12px;color:#8b8fa3;margin-top:2px}
#panelSearch{width:100%;padding:9px 14px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;outline:none;margin-top:10px}
#panelSearch:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
#factoryList{flex:1;overflow-y:auto;padding:8px 0}
.group-header{padding:8px 18px;font-size:13px;font-weight:600;color:#374151;cursor:pointer;display:flex;align-items:center;gap:6px;background:#f9fafb;border-top:1px solid #f0f0f0;user-select:none}
.group-header:hover{background:#f0f4ff}
.group-header .arrow{font-size:10px;transition:transform .2s}
.group-header .arrow.collapsed{transform:rotate(-90deg)}
.group-header .count{font-size:11px;color:#9ca3af;font-weight:400}
.group-items{overflow:hidden;transition:max-height .3s}
.factory-item{padding:8px 18px 8px 28px;cursor:pointer;font-size:13px;color:#374151;border-bottom:1px solid #f5f5f5;transition:background .15s}
.factory-item:hover{background:#f0f4ff}
.factory-item .fname{font-weight:500;line-height:1.4}
.factory-item .fnote{font-size:11px;color:#9ca3af;margin-top:2px}
.factory-item .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;margin-right:4px}
.tag-jg{background:#fef2f2;color:#dc2626}
.tag-jk{background:#eff6ff;color:#2563eb}
.tag-ky{background:#f0fdf4;color:#16a34a}
.tag-gz{background:#eef2ff;color:#4f46e5}
#panelFooter{padding:10px 18px;border-top:1px solid #e5e7eb;font-size:12px;color:#9ca3af;text-align:center}
/* 切换按钮 */
#togglePanel{position:absolute;left:340px;top:50%;transform:translateY(-50%);z-index:1001;width:24px;height:48px;background:#fff;border:1px solid #e5e7eb;border-left:none;border-radius:0 8px 8px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#6b7280;transition:left .3s;box-shadow:2px 0 8px rgba(0,0,0,.06)}
#togglePanel.collapsed{left:0}
/* 地图 */
#map{flex:1;height:100vh}
/* 右侧控制面板 */
#controlPanel{position:absolute;right:12px;top:12px;z-index:1000;width:280px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);max-height:calc(100vh - 80px);overflow-y:auto}
.cp-section{padding:14px 16px;border-bottom:1px solid #f0f0f0}
.cp-section:last-child{border-bottom:none}
.cp-title{font-size:13px;font-weight:600;color:#374151;margin-bottom:8px}
/* 类别开关 */
.layer-row{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.layer-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:14px}
.layer-name{flex:1;font-size:13px;color:#374151}
.layer-count{font-size:11px;color:#9ca3af;margin-right:4px}
.toggle-switch{width:36px;height:20px;border-radius:10px;background:#e5e7eb;position:relative;cursor:pointer;transition:background .2s}
.toggle-switch.on{background:#3b82f6}
.toggle-switch::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-switch.on::after{left:18px}
/* 嘉吉筛选 */
#cargillFilter{width:100%;padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;font-size:13px;outline:none}
#cargillFilter:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
#filterSuggestions{max-height:160px;overflow-y:auto;margin-top:4px;border:1px solid #e5e7eb;border-radius:8px;display:none}
#filterSuggestions .sug-item{padding:6px 12px;font-size:12px;cursor:pointer;color:#374151;border-bottom:1px solid #f5f5f5}
#filterSuggestions .sug-item:hover{background:#f0f4ff}
#filterSuggestions .sug-item:last-child{border-bottom:none}
#activeFilter{margin-top:6px;font-size:12px;color:#3b82f6;display:none}
#clearFilter{background:none;border:none;color:#ef4444;cursor:pointer;font-size:12px;margin-left:8px}
/* 工具按钮 */
.tool-btn{display:flex;align-items:center;gap:6px;width:100%;padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;color:#374151;margin-bottom:6px;transition:all .2s}
.tool-btn:hover{background:#f0f4ff;border-color:#3b82f6}
.tool-btn.active{background:#eff6ff;border-color:#3b82f6;color:#2563eb}
/* 统计 */
#statsBar{padding:10px 16px;font-size:12px;color:#6b7280;text-align:center}
/* 测距面板 */
#distancePanel{position:absolute;left:50px;top:12px;z-index:1000;background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:12px 16px;display:none;min-width:180px}
#distancePanel .dist-title{font-size:13px;font-weight:600;color:#374151;margin-bottom:4px}
#distancePanel .dist-value{font-size:18px;font-weight:700;color:#3b82f6}
#distancePanel .dist-clear{background:none;border:1px solid #e5e7eb;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;margin-top:6px;color:#6b7280}
#distancePanel .dist-clear:hover{background:#fef2f2;color:#ef4444;border-color:#ef4444}
/* 绘图工具栏 */
#drawToolbar{position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:1000;background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:6px 10px;display:flex;align-items:center;gap:4px}
.draw-btn{width:32px;height:32px;border:none;border-radius:6px;background:transparent;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.draw-btn:hover{background:#f0f4ff}
.draw-btn.active{background:#eff6ff;color:#2563eb}
.draw-sep{width:1px;height:20px;background:#e5e7eb;margin:0 4px}
.color-dot{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .15s}
.color-dot:hover,.color-dot.active{border-color:#374151;transform:scale(1.2)}
/* 批量测距面板 */
#batchPanel{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:1000;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.12);padding:16px 20px;display:none;max-width:480px;width:90%;max-height:50vh;overflow-y:auto}
#batchPanel .batch-title{font-size:14px;font-weight:600;color:#374151;margin-bottom:8px}
#batchPanel .batch-hint{font-size:12px;color:#9ca3af;margin-bottom:10px}
.batch-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;border-bottom:1px solid #f5f5f5}
.batch-row .rank{width:24px;text-align:center;font-weight:600;color:#9ca3af}
.batch-row .bname{flex:1;color:#374151}
.batch-row .bdist{font-weight:600;min-width:60px;text-align:right}
.batch-row .bdir{color:#6b7280;min-width:30px;text-align:center}
.batch-actions{margin-top:10px;display:flex;gap:8px}
.batch-actions button{padding:6px 14px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-size:12px;transition:all .2s}
.batch-actions button:hover{background:#f0f4ff;border-color:#3b82f6}
.batch-actions .export-btn{background:#3b82f6;color:#fff;border-color:#3b82f6}
.batch-actions .export-btn:hover{background:#2563eb}
/* 画圈面板 */
#circlePanel{position:absolute;right:12px;bottom:20px;z-index:1000;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.12);padding:14px 18px;display:none;min-width:220px}
#circlePanel .circle-title{font-size:13px;font-weight:600;color:#374151;margin-bottom:8px}
.radius-btns{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.radius-btn{padding:4px 10px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;transition:all .15s}
.radius-btn:hover,.radius-btn.active{background:#eff6ff;border-color:#3b82f6;color:#2563eb}
#circleList{max-height:120px;overflow-y:auto}
.circle-item{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid #f5f5f5}
.circle-item .del-circle{background:none;border:none;color:#ef4444;cursor:pointer;font-size:14px}
.circle-actions{margin-top:6px;display:flex;gap:6px}
.circle-actions button{padding:4px 10px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-size:12px}
/* ====== 图标样式 ====== */
.marker-star{font-size:22px;line-height:22px;text-align:center;color:#e74c3c;text-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:auto!important}
.marker-triangle{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:15px solid #3498db;pointer-events:auto!important;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.marker-circle-green{width:12px;height:12px;border-radius:50%;background:#27ae60;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:auto!important}
.marker-circle-blue{width:12px;height:12px;border-radius:50%;background:#3498db;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:auto!important}
/* draw mode - 禁用标记交互 */
.draw-mode .legend-marker{pointer-events:none!important}
.draw-mode .marker-star,.draw-mode .marker-triangle,.draw-mode .marker-circle-green,.draw-mode .marker-circle-blue{pointer-events:none!important}
/* Toast */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 24px;border-radius:8px;font-size:13px;color:#fff;background:#374151;box-shadow:0 4px 12px rgba(0,0,0,.15);opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
/* Leaflet popup */
.leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.leaflet-popup-content{font-size:13px;line-height:1.5;margin:10px 14px}
.popup-name{font-weight:700;font-size:14px;color:#1a1a2e;margin-bottom:4px}
.popup-info{color:#6b7280;font-size:12px}
/* 距离标签 */
.dist-label{background:rgba(59,130,246,.9);color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
/* 上传区域 */
#uploadOverlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2000;background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.2);padding:32px 40px;display:none;text-align:center;min-width:360px}
#uploadOverlay h3{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:8px}
#uploadOverlay p{font-size:13px;color:#6b7280;margin-bottom:16px}
#uploadOverlay .upload-zone{border:2px dashed #d1d5db;border-radius:12px;padding:32px 20px;cursor:pointer;transition:all .2s}
#uploadOverlay .upload-zone:hover{border-color:#3b82f6;background:#f0f4ff}
#uploadOverlay .upload-zone .icon{font-size:40px;margin-bottom:8px}
#uploadOverlay .upload-zone .text{font-size:14px;color:#6b7280}
#uploadOverlay .close-upload{position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:#9ca3af}
#uploadOverlay .close-upload:hover{color:#374151}
/* 滚动条 */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#9ca3af}
</style>
</head>
<body>
<!-- 左侧面板 -->
<div id="leftPanel">
    <div class="panel-header">
        <h2>📍 工厂明细</h2>
        <p>点击定位 / 支持搜索</p>
        <input type="text" id="panelSearch" placeholder="搜索工厂名称...">
    </div>
    <div id="factoryList"></div>
    <div id="panelFooter">显示 <span id="visibleCount">0</span> / <span id="totalCount">0</span> 家</div>
</div>
<div id="togglePanel" onclick="toggleLeftPanel()">◀</div>
<div id="map"></div>
<!-- 右侧控制面板 -->
<div id="controlPanel">
    <div class="cp-section">
        <div class="cp-title">📋 类别开关</div>
        <div class="layer-row" onclick="toggleLayer('jg')">
            <div class="layer-icon" style="color:#e74c3c;font-size:18px">★</div>
            <div class="layer-name">嘉吉工厂</div>
            <div class="layer-count" id="countJG">0</div>
            <div class="toggle-switch on" id="swJG"></div>
        </div>
        <div class="layer-row" onclick="toggleLayer('jk')">
            <div class="layer-icon" style="color:#3498db;font-size:14px">▲</div>
            <div class="layer-name">竞争厂家</div>
            <div class="layer-count" id="countJK">0</div>
            <div class="toggle-switch on" id="swJK"></div>
        </div>
        <div class="layer-row" onclick="toggleLayer('ky')">
            <div class="layer-icon" style="color:#27ae60;font-size:16px">●</div>
            <div class="layer-name">可用</div>
            <div class="layer-count" id="countKY">0</div>
            <div class="toggle-switch on" id="swKY"></div>
        </div>
        <div class="layer-row" onclick="toggleLayer('gz')">
            <div class="layer-icon" style="color:#3498db;font-size:16px">●</div>
            <div class="layer-name">关注</div>
            <div class="layer-count" id="countGZ">0</div>
            <div class="toggle-switch on" id="swGZ"></div>
        </div>
    </div>
    <div class="cp-section">
        <div class="cp-title">🔍 嘉吉工厂筛选</div>
        <input type="text" id="cargillFilter" placeholder="输入关键词模糊筛选..." oninput="onFilterInput()">
        <div id="filterSuggestions"></div>
        <div id="activeFilter">已选：<span id="filterName"></span><button id="clearFilter" onclick="clearCargillFilter()">✕ 清除</button></div>
    </div>
    <div class="cp-section">
        <div class="cp-title">🛠️ 快捷工具</div>
        <button class="tool-btn" onclick="showUploadOverlay()">📂 上传Excel更新数据</button>
        <button class="tool-btn" onclick="exportFiltered()">📥 导出筛选结果</button>
        <button class="tool-btn" id="batchBtn" onclick="startBatchMeasure()">📏 批量测距</button>
        <button class="tool-btn" id="circleBtn" onclick="startCircleTool()">⭕ 画圈工具</button>
    </div>
    <div id="statsBar">当前可见：<strong id="statsVisible">0</strong> 家</div>
</div>
<!-- 测距面板 -->
<div id="distancePanel">
    <div class="dist-title">📏 测距</div>
    <div class="dist-value" id="distValue">0 m</div>
    <button class="dist-clear" onclick="clearDistance()">清除</button>
</div>
<!-- 绘图工具栏 -->
<div id="drawToolbar">
    <button class="draw-btn" title="标记点" onclick="setDrawTool('marker')">📍</button>
    <button class="draw-btn" title="线条" onclick="setDrawTool('polyline')">〰️</button>
    <button class="draw-btn" title="箭头" onclick="setDrawTool('arrow')">➡️</button>
    <button class="draw-btn" title="多边形" onclick="setDrawTool('polygon')">⬡</button>
    <button class="draw-btn" title="矩形" onclick="setDrawTool('rectangle')">▭</button>
    <button class="draw-btn" title="圆形" onclick="setDrawTool('circle')">◯</button>
    <button class="draw-btn" title="文字标注" onclick="setDrawTool('text')">📝</button>
    <div class="draw-sep"></div>
    <div class="color-dot active" style="background:#e74c3c" onclick="setDrawColor('#e74c3c',this)"></div>
    <div class="color-dot" style="background:#f39c12" onclick="setDrawColor('#f39c12',this)"></div>
    <div class="color-dot" style="background:#f1c40f" onclick="setDrawColor('#f1c40f',this)"></div>
    <div class="color-dot" style="background:#27ae60" onclick="setDrawColor('#27ae60',this)"></div>
    <div class="color-dot" style="background:#3498db" onclick="setDrawColor('#3498db',this)"></div>
    <div class="color-dot" style="background:#9b59b6" onclick="setDrawColor('#9b59b6',this)"></div>
    <div class="draw-sep"></div>
    <button class="draw-btn" title="编辑" onclick="enableEdit()">✏️</button>
    <button class="draw-btn" title="删除" onclick="enableDelete()">🗑️</button>
    <button class="draw-btn" title="清除全部" onclick="clearAllDrawings()">🧹</button>
</div>
<!-- 批量测距面板 -->
<div id="batchPanel">
    <div class="batch-title">📏 批量测距</div>
    <div class="batch-hint" id="batchHint">点击地图选择参考点</div>
    <div id="batchResults"></div>
    <div class="batch-actions" id="batchActions" style="display:none">
        <button onclick="clearBatchResults()">清除</button>
        <button onclick="closeBatchPanel()">关闭</button>
        <button class="export-btn" onclick="exportBatchResults()">导出Excel</button>
    </div>
</div>
<!-- 画圈面板 -->
<div id="circlePanel">
    <div class="circle-title">⭕ 画圈工具</div>
    <div class="radius-btns">
        <button class="radius-btn active" onclick="setCircleRadius(150000,this)">150km</button>
        <button class="radius-btn" onclick="setCircleRadius(200000,this)">200km</button>
        <button class="radius-btn" onclick="setCircleRadius(300000,this)">300km</button>
        <button class="radius-btn" onclick="setCircleRadius(500000,this)">500km</button>
    </div>
    <div id="circleList"></div>
    <div class="circle-actions">
        <button onclick="clearAllCircles()">全清</button>
        <button onclick="closeCirclePanel()">关闭</button>
    </div>
</div>
<!-- 上传Excel弹窗 -->
<div id="uploadOverlay">
    <button class="close-upload" onclick="closeUploadOverlay()">✕</button>
    <h3>📂 上传Excel更新数据</h3>
    <p>请上传与原文件相同格式的 .xlsx 文件<br>支持Sheet：嘉吉工厂、竞争厂家、可用、关注</p>
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <div class="icon">📄</div>
        <div class="text">点击选择文件或拖拽到此处</div>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" onchange="handleFileUpload(event)">
    <div id="uploadProgress" style="margin-top:12px;font-size:13px;color:#6b7280;display:none"></div>
    <div id="storageStatus" style="margin-top:8px;font-size:12px;color:#9ca3af"></div>
    <div style="margin-top:8px;display:flex;gap:8px;justify-content:center">
        <button onclick="downloadUpdatedHTML()" style="padding:6px 16px;font-size:12px;background:#3b82f6;border:none;border-radius:6px;cursor:pointer;color:#fff">💾 下载更新版HTML</button>
        <button onclick="resetToDefault()" style="padding:6px 16px;font-size:12px;background:#f3f4f6;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;color:#6b7280">🔄 恢复默认数据</button>
    </div>
</div>
<!-- Toast -->
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

const STORAGE_KEY = 'corn_map_data_v1';
function saveToStorage() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            jg: dataJG, jk: dataJK, ky: dataKY, gz: dataGZ,
            names: allCGNames, ts: Date.now()
        }));
    } catch(e) { console.warn('保存数据到localStorage失败:', e); }
}
function loadFromStorage() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return false;
        const d = JSON.parse(raw);
        if(d.jg && d.jg.length) { dataJG = d.jg; }
        if(d.jk && d.jk.length) { dataJK = d.jk; }
        if(d.ky && d.ky.length) { dataKY = d.ky; }
        if(d.gz && d.gz.length) { dataGZ = d.gz; }
        if(d.names && d.names.length) { allCGNames = d.names; }
        return true;
    } catch(e) { console.warn('从localStorage加载数据失败:', e); return false; }
}

function iconStar() {
    return L.divIcon({className:'legend-marker',html:'<div class="marker-star">★</div>',iconSize:[22,22],iconAnchor:[11,11]});
}
function iconTriangle() {
    return L.divIcon({className:'legend-marker',html:'<div class="marker-triangle"></div>',iconSize:[16,15],iconAnchor:[8,15]});
}
function iconCircleGreen() {
    return L.divIcon({className:'legend-marker',html:'<div class="marker-circle-green"></div>',iconSize:[12,12],iconAnchor:[6,6]});
}
function iconCircleBlue() {
    return L.divIcon({className:'legend-marker',html:'<div class="marker-circle-blue"></div>',iconSize:[12,12],iconAnchor:[6,6]});
}

// ===== 创建标记 =====
function createMarkers() {
    // 清除旧标记
    ['jg','jk','ky','gz'].forEach(t => {
        if(layers[t]) map.removeLayer(layers[t]);
        markers[t] = [];
    });

    // 嘉吉工厂
    layers.jg = L.layerGroup();
    dataJG.forEach((d,i) => {
        const m = L.marker([d.y,d.x],{icon:iconStar()})
            .bindPopup('<div class="popup-name">'+d.n+'</div><div class="popup-info">'+(d.t||'')+'</div>');
        m._data = Object.assign({},d,{type:'jg',idx:i});
        markers.jg.push(m);
        if(layerVisible.jg) layers.jg.addLayer(m);
    });
    if(layerVisible.jg) layers.jg.addTo(map);

    // 竞争厂家
    layers.jk = L.layerGroup();
    dataJK.forEach((d,i) => {
        const m = L.marker([d.y,d.x],{icon:iconTriangle()})
            .bindPopup('<div class="popup-name">'+d.n+'</div><div class="popup-info">关联：'+d.c+'<br>'+(d.t||'')+'</div>');
        m._data = Object.assign({},d,{type:'jk',idx:i});
        markers.jk.push(m);
        if(layerVisible.jk) layers.jk.addLayer(m);
    });
    if(layerVisible.jk) layers.jk.addTo(map);

    // 可用
    layers.ky = L.layerGroup();
    dataKY.forEach((d,i) => {
        const m = L.marker([d.y,d.x],{icon:iconCircleGreen()})
            .bindPopup('<div class="popup-name">'+d.n+'</div><div class="popup-info">关联：'+d.c+'<br>原料：'+(d.m||'-')+'<br>'+(d.t||'')+'</div>');
        m._data = Object.assign({},d,{type:'ky',idx:i});
        markers.ky.push(m);
        if(layerVisible.ky) layers.ky.addLayer(m);
    });
    if(layerVisible.ky) layers.ky.addTo(map);

    // 关注
    layers.gz = L.layerGroup();
    dataGZ.forEach((d,i) => {
        const m = L.marker([d.y,d.x],{icon:iconCircleBlue()})
            .bindPopup('<div class="popup-name">'+d.n+'</div><div class="popup-info">关联：'+d.c+'<br>原料：'+(d.m||'-')+'<br>'+(d.t||'')+'</div>');
        m._data = Object.assign({},d,{type:'gz',idx:i});
        markers.gz.push(m);
        if(layerVisible.gz) layers.gz.addLayer(m);
    });
    if(layerVisible.gz) layers.gz.addTo(map);
}

createMarkers();

function fitAllVisible() {
    const pts = [];
    ['jg','jk','ky','gz'].forEach(t => {
        if(layerVisible[t]) markers[t].forEach(m => { if(layers[t].hasLayer(m)) pts.push(m.getLatLng()); });
    });
    if(pts.length > 0) map.fitBounds(L.latLngBounds(pts).pad(0.1));
}
fitAllVisible();

// ===== 筛选逻辑 =====
function applyFilters() {
    const search = document.getElementById('panelSearch').value.toLowerCase();
    const cf = activeCargillFilter;
    let visCount = 0;

    ['jg','jk','ky','gz'].forEach(type => {
        markers[type].forEach(m => {
            let show = layerVisible[type];
            if(cf) {
                if(type === 'jg') show = show && m._data.n === cf;
                else show = show && m._data.c === cf;
            }
            if(search) {
                const n = (m._data.n||'').toLowerCase();
                const c = (m._data.c||'').toLowerCase();
                const t = (m._data.t||'').toLowerCase();
                show = show && (n.includes(search) || c.includes(search) || t.includes(search));
            }
            if(show) {
                if(!layers[type].hasLayer(m)) layers[type].addLayer(m);
                visCount++;
            } else {
                if(layers[type].hasLayer(m)) layers[type].removeLayer(m);
            }
        });
    });

    document.getElementById('visibleCount').textContent = visCount;
    document.getElementById('statsVisible').textContent = visCount;
    document.getElementById('totalCount').textContent = dataJG.length + dataJK.length + dataKY.length + dataGZ.length;
    updateCounts();
    buildFactoryList();
}

function updateCounts() {
    const cf = activeCargillFilter;
    const count = (type, key) => markers[type].filter(m => !cf || m._data[key] === cf).length;
    document.getElementById('countJG').textContent = count('jg','n');
    document.getElementById('countJK').textContent = count('jk','c');
    document.getElementById('countKY').textContent = count('ky','c');
    document.getElementById('countGZ').textContent = count('gz','c');
}

// ===== 左侧面板 =====
function buildFactoryList() {
    const search = document.getElementById('panelSearch').value.toLowerCase();
    const cf = activeCargillFilter;
    const list = document.getElementById('factoryList');
    let html = '';

    function isVisible(type, m) {
        if(!layerVisible[type]) return false;
        if(!layers[type].hasLayer(m)) return false;
        if(cf && type !== 'jg' && m._data.c !== cf) return false;
        if(cf && type === 'jg' && m._data.n !== cf) return false;
        if(search) {
            const n = (m._data.n||'').toLowerCase();
            const c = (m._data.c||'').toLowerCase();
            const t = (m._data.t||'').toLowerCase();
            if(!n.includes(search) && !c.includes(search) && !t.includes(search)) return false;
        }
        return true;
    }

    // 嘉吉工厂
    const jgItems = markers.jg.filter(m => isVisible('jg',m));
    if(jgItems.length) {
        html += '<div class="group-header" onclick="toggleGroup(this)"><span class="arrow">▼</span><span class="tag tag-jg">★</span> 嘉吉工厂 <span class="count">('+jgItems.length+')</span></div><div class="group-items">';
        jgItems.forEach(m => { html += '<div class="factory-item" onclick="flyToMarker(\'jg\','+m._data.idx+')"><div class="fname">'+m._data.n+'</div><div class="fnote">'+(m._data.t||'')+'</div></div>'; });
        html += '</div>';
    }

    // 竞争厂家 - 按嘉吉工厂分组
    const jkItems = markers.jk.filter(m => isVisible('jk',m));
    if(jkItems.length) {
        const groups = {};
        jkItems.forEach(m => { (groups[m._data.c] = groups[m._data.c]||[]).push(m); });
        Object.keys(groups).sort().forEach(cg => {
            html += '<div class="group-header" onclick="toggleGroup(this)"><span class="arrow">▼</span><span class="tag tag-jk">▲</span> '+cg+' <span class="count">('+groups[cg].length+')</span></div><div class="group-items">';
            groups[cg].forEach(m => { html += '<div class="factory-item" onclick="flyToMarker(\'jk\','+m._data.idx+')"><div class="fname">'+m._data.n+'</div><div class="fnote">'+(m._data.t||'')+'</div></div>'; });
            html += '</div>';
        });
    }

    // 可用
    const kyItems = markers.ky.filter(m => isVisible('ky',m));
    if(kyItems.length) {
        const groups = {};
        kyItems.forEach(m => { (groups[m._data.c] = groups[m._data.c]||[]).push(m); });
        Object.keys(groups).sort().forEach(cg => {
            html += '<div class="group-header" onclick="toggleGroup(this)"><span class="arrow">▼</span><span class="tag tag-ky">●</span> '+cg+'-可用 <span class="count">('+groups[cg].length+')</span></div><div class="group-items">';
            groups[cg].forEach(m => { html += '<div class="factory-item" onclick="flyToMarker(\'ky\','+m._data.idx+')"><div class="fname">'+m._data.n+'</div><div class="fnote">'+(m._data.m||'')+' '+(m._data.t||'')+'</div></div>'; });
            html += '</div>';
        });
    }

    // 关注
    const gzItems = markers.gz.filter(m => isVisible('gz',m));
    if(gzItems.length) {
        const groups = {};
        gzItems.forEach(m => { (groups[m._data.c] = groups[m._data.c]||[]).push(m); });
        Object.keys(groups).sort().forEach(cg => {
            html += '<div class="group-header" onclick="toggleGroup(this)"><span class="arrow">▼</span><span class="tag tag-gz">●</span> '+cg+'-关注 <span class="count">('+groups[cg].length+')</span></div><div class="group-items">';
            groups[cg].forEach(m => { html += '<div class="factory-item" onclick="flyToMarker(\'gz\','+m._data.idx+')"><div class="fname">'+m._data.n+'</div><div class="fnote">'+(m._data.m||'')+' '+(m._data.t||'')+'</div></div>'; });
            html += '</div>';
        });
    }

    if(!html) html = '<div style="padding:20px;text-align:center;color:#9ca3af;font-size:13px">无匹配结果</div>';
    list.innerHTML = html;
}

function toggleGroup(el) {
    const arrow = el.querySelector('.arrow');
    const items = el.nextElementSibling;
    if(arrow.classList.contains('collapsed')) {
        arrow.classList.remove('collapsed');
        items.style.maxHeight = items.scrollHeight + 'px';
        setTimeout(() => items.style.maxHeight = 'none', 300);
    } else {
        items.style.maxHeight = items.scrollHeight + 'px';
        requestAnimationFrame(() => { items.style.maxHeight = '0px'; items.style.overflow = 'hidden'; });
        arrow.classList.add('collapsed');
    }
}

function flyToMarker(type, idx) {
    const m = markers[type][idx];
    if(m) { map.flyTo(m.getLatLng(), 13, {duration:0.8}); setTimeout(() => m.openPopup(), 800); }
}

// ===== 类别开关 =====
function toggleLayer(type) {
    layerVisible[type] = !layerVisible[type];
    document.getElementById('sw'+type.toUpperCase()).classList.toggle('on', layerVisible[type]);
    if(layerVisible[type]) { layers[type].addTo(map); } else { map.removeLayer(layers[type]); }
    applyFilters();
}

function onFilterInput() {
    const val = document.getElementById('cargillFilter').value.trim();
    const sug = document.getElementById('filterSuggestions');
    if(!val) { sug.style.display = 'none'; return; }
    const matches = allCGNames.filter(n => n.toLowerCase().includes(val.toLowerCase()));

// ===== Haversine =====
function haversine(lat1,lng1,lat2,lng2) {
    const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
    const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function formatDist(m) { return m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(1)+' km'; }
function getDirection(lat1,lng1,lat2,lng2) {
    const angle=Math.atan2(lng2-lng1,lat2-lat1)*180/Math.PI;
    return ['北','东北','东','东南','南','西南','西','西北'][Math.round(((angle+360)%360)/45)%8];
}

        measureLines.push(line);
        const dist=haversine(prev.lat,prev.lng,latlng.lat,latlng.lng);

function setDrawTool(tool) {
    if(currentDrawTool===tool) { exitInteractionMode(); return; }
    exitInteractionMode();
    currentDrawTool = tool;
    event.target.closest('.draw-btn').classList.add('active');
    if(['polyline','arrow','polygon','rectangle','circle'].includes(tool)) {
        enterInteractionMode();
        document.getElementById('drawToolbar').style.display = 'flex';
        const opts = {shapeOptions:{color:drawColor,weight:3}};
        if(tool==='polyline'||tool==='arrow') currentDrawHandler=new L.Draw.Polyline(map,opts);
        else if(tool==='polygon') currentDrawHandler=new L.Draw.Polygon(map,opts);
        else if(tool==='rectangle') currentDrawHandler=new L.Draw.Rectangle(map,opts);
        else if(tool==='circle') currentDrawHandler=new L.Draw.Circle(map,opts);
        currentDrawHandler.enable();
        map.once('draw:created', function(e) {
            const layer = e.layer;
            // 确保绘制的图形在drawPane中
            if(layer._pane) layer._pane = 'drawPane';
            drawnItems.addLayer(layer);
            layer.bindTooltip('双击编辑 / 删除');
            // 箭头 - 按像素固定大小，缩放不变形
            if(tool==='arrow') {
                const latlngs = layer.getLatLngs();
                if(latlngs.length>=2) {
                    const last=latlngs[latlngs.length-1], prev=latlngs[latlngs.length-2];
                    const headLayer = createArrowHead(last, prev, drawColor);
                    drawnItems.addLayer(headLayer);
                    arrowsData.push({
                        lineLayer: layer,
                        headLayer: headLayer,
                        lastLat: last.lat, lastLng: last.lng,
                        prevLat: prev.lat, prevLng: prev.lng,
                        color: drawColor
                    });
                }
            }
            currentDrawTool = null;
            document.querySelectorAll('.draw-btn').forEach(b=>b.classList.remove('active'));
            document.getElementById('map').classList.remove('draw-mode');
            map.getContainer().style.cursor = '';
        });
    }
}

function setDrawColor(color,el) { drawColor=color; document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active')); el.classList.add('active'); }
function addDrawMarker(latlng) { const m=L.circleMarker(latlng,{radius:8,color:drawColor,fillColor:drawColor,fillOpacity:0.8,pane:'drawPane'}).addTo(drawnItems); m.bindTooltip('双击编辑 / 删除'); }

// 创建像素级箭头头部（不随缩放变形）
function createArrowHead(last, prev, color) {
    const tipPx = map.latLngToContainerPoint(last);
    const prevPx = map.latLngToContainerPoint(prev);
    const angle = Math.atan2(tipPx.y - prevPx.y, tipPx.x - prevPx.x);
    const headLen = 22; // 箭头长度（像素）
    const headAngle = Math.PI / 6.5; // 30°开角
    const p1x = tipPx.x - headLen * Math.cos(angle - headAngle);
    const p1y = tipPx.y - headLen * Math.sin(angle - headAngle);
    const p2x = tipPx.x - headLen * Math.cos(angle + headAngle);
    const p2y = tipPx.y - headLen * Math.sin(angle + headAngle);
    const p1 = map.containerPointToLatLng([p1x, p1y]);
    const p2 = map.containerPointToLatLng([p2x, p2y]);
    return L.polygon([last, p1, p2], {color:color, fillColor:color, fillOpacity:0.92, weight:1, pane:'drawPane'});
}
// 缩放时重绘所有箭头
function redrawAllArrows() {
    arrowsData.forEach(a => {
        drawnItems.removeLayer(a.headLayer);
        const last = L.latLng(a.lastLat, a.lastLng);
        const prev = L.latLng(a.prevLat, a.prevLng);
        const newHead = createArrowHead(last, prev, a.color);
        drawnItems.addLayer(newHead);
        a.headLayer = newHead;
    });
}
map.on('zoomend', redrawAllArrows);
// 删除图形时清理箭头数据
map.on('draw:deleted', function(e) {
    const removed = e.layers;
    arrowsData = arrowsData.filter(a => {
        if(removed.hasLayer(a.lineLayer) || removed.hasLayer(a.headLayer)) {
            return false;
        }
        return true;
    });
});

function startBatchMeasure() {
    exitInteractionMode();
    batchMode = true;
    document.getElementById('batchPanel').style.display='block';

function doBatchMeasure(latlng) {
    batchMode=false;
    document.getElementById('batchHint').textContent='参考点：'+latlng.lat.toFixed(4)+', '+latlng.lng.toFixed(4);
    const results=[];
    ['jg','jk','ky','gz'].forEach(type => {
        const typeNames={jg:'嘉吉',jk:'竞争',ky:'可用',gz:'关注'};
        markers[type].forEach(m => {
            if(layers[type].hasLayer(m)) {
                const dist=haversine(latlng.lat,latlng.lng,m._data.y,m._data.x);
                const dir=getDirection(latlng.lat,latlng.lng,m._data.y,m._data.x);
                results.push({name:m._data.n,dist:dist,dir:dir,type:type,typeName:typeNames[type],lat:m._data.y,lng:m._data.x});
            }
        });
    });
    results.sort((a,b)=>a.dist-b.dist);
    batchResults=results;
    // 绘制连线
    batchLines=[];
    results.forEach(r => {
        let color='#16a34a';
        if(r.dist>200000)color='#ef4444'; else if(r.dist>100000)color='#f39c12'; else if(r.dist>50000)color='#3498db';
        const line=L.polyline([latlng,[r.lat,r.lng]],{color:color,weight:1,opacity:0.5,dashArray:'4,4'}).addTo(map);
        batchLines.push(line);
    });
    // 显示结果
    const html=results.slice(0,50).map((r,i) => {
        let color='#16a34a';
        if(r.dist>200000)color='#ef4444'; else if(r.dist>100000)color='#f39c12'; else if(r.dist>50000)color='#3498db';
        return '<div class="batch-row"><span class="rank">'+(i+1)+'</span><span class="tag tag-'+r.type+'">'+r.typeName+'</span><span class="bname">'+r.name+'</span><span class="bdir">'+r.dir+'</span><span class="bdist" style="color:'+color+'">'+formatDist(r.dist)+'</span></div>';
    }).join('');
    document.getElementById('batchResults').innerHTML=html;
    document.getElementById('batchActions').style.display='flex';
    document.getElementById('batchHint').textContent+=' — 共'+results.length+'家';
    document.getElementById('map').classList.remove('draw-mode');
    map.getContainer().style.cursor='';
}
function closeBatchPanel() {
    batchMode=false;
    document.getElementById('batchPanel').style.display='none';
    document.getElementById('map').classList.remove('draw-mode');
    map.getContainer().style.cursor='';
    document.getElementById('drawToolbar').style.display='flex';
}
function clearBatchResults() {
    batchLines.forEach(l => map.removeLayer(l));
    batchLines = [];
    batchResults = [];
    document.getElementById('batchResults').innerHTML = '';
    document.getElementById('batchActions').style.display = 'none';
    document.getElementById('batchHint').textContent = '点击地图选择参考点';
    batchMode = true;
}
function exportBatchResults() {
    if(!batchResults.length) return;
    const data=batchResults.map((r,i)=>({'排名':i+1,'类型':r.typeName,'工厂名称':r.name,'距离':formatDist(r.dist),'方向':r.dir,'经度':r.lng.toFixed(6),'纬度':r.lat.toFixed(6)}));
    const ws=XLSX.utils.json_to_sheet(data);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'批量测距');
    XLSX.writeFile(wb,'批量测距结果_'+Date.now()+'.xlsx');
}

function handleFileUpload(event) {

function processUploadedFile(file) {
    if(!file.name.match(/\.xlsx?$/i)) { showToast('请上传 .xlsx 或 .xls 格式文件'); return; }
    const prog = document.getElementById('uploadProgress');
    prog.style.display = 'block';
    prog.textContent = '正在解析文件...';

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type:'array'});
            let newJG=[], newJK=[], newKY=[], newGZ=[];

            // 解析嘉吉工厂
            if(wb.SheetNames.includes('嘉吉工厂')) {
                const ws = wb.Sheets['嘉吉工厂'];
                const rows = XLSX.utils.sheet_to_json(ws, {header:1});
                for(let i=1;i<rows.length;i++) {
                    const r = rows[i];
                    if(r[0] && r[2]) {
                        const coord = String(r[2]).trim().split(',');
                        if(coord.length===2) {
                            newJG.push({n:String(r[0]).trim().replace(/\xa0/g,''),t:r[1]?String(r[1]).trim():'',x:parseFloat(coord[0]),y:parseFloat(coord[1])});
                        }
                    }
                }
            }
            // 解析竞争厂家
            if(wb.SheetNames.includes('竞争厂家')) {
                const ws = wb.Sheets['竞争厂家'];
                const rows = XLSX.utils.sheet_to_json(ws, {header:1});
                for(let i=1;i<rows.length;i++) {
                    const r = rows[i];
                    if(r[0] && r[1] && r[3]) {
                        const coord = String(r[3]).trim().split(',');
                        if(coord.length===2) {
                            newJK.push({c:String(r[0]).trim().replace(/\xa0/g,''),n:String(r[1]).trim(),t:r[2]?String(r[2]).trim():'',x:parseFloat(coord[0]),y:parseFloat(coord[1])});
                        }
                    }
                }
            }
            // 解析可用
            if(wb.SheetNames.includes('可用')) {
                const ws = wb.Sheets['可用'];
                const rows = XLSX.utils.sheet_to_json(ws, {header:1});
                for(let i=1;i<rows.length;i++) {
                    const r = rows[i];
                    if(r[0] && r[4]) {
                        const coord = String(r[4]).trim().split(',');
                        if(coord.length===2) {
                            newKY.push({c:String(r[0]).trim().replace(/\xa0/g,''),m:r[1]?String(r[1]).trim():'',n:r[2]?String(r[2]).trim():'',t:r[3]?String(r[3]).trim():'',x:parseFloat(coord[0]),y:parseFloat(coord[1])});
                        }
                    }
                }
            }
            // 解析关注
            if(wb.SheetNames.includes('关注')) {
                const ws = wb.Sheets['关注'];
                const rows = XLSX.utils.sheet_to_json(ws, {header:1});
                for(let i=1;i<rows.length;i++) {
                    const r = rows[i];
                    if(r[0] && r[4]) {
                        const coord = String(r[4]).trim().split(',');
                        if(coord.length===2) {
                            newGZ.push({c:String(r[0]).trim().replace(/\xa0/g,''),m:r[1]?String(r[1]).trim():'',n:r[2]?String(r[2]).trim():'',t:r[3]?String(r[3]).trim():'',x:parseFloat(coord[0]),y:parseFloat(coord[1])});
                        }
                    }
                }
            }

            if(!newJG.length && !newJK.length && !newKY.length && !newGZ.length) {
                prog.textContent = '未找到有效数据，请检查文件格式';
                return;
            }

            // 更新数据
            dataJG = newJG;
            dataJK = newJK;
            dataKY = newKY;
            dataGZ = newGZ;
            allCGNames = [...new Set([...newJG.map(d=>d.n),...newJK.map(d=>d.c),...newKY.map(d=>d.c),...newGZ.map(d=>d.c)])].sort();

            // 保存到 localStorage
            saveToStorage();

            // 重建标记
            clearAllDrawings();
            clearAllCircles();
            clearDistance();
            activeCargillFilter = null;
            document.getElementById('cargillFilter').value = '';
            document.getElementById('activeFilter').style.display = 'none';
            createMarkers();
            applyFilters();
            fitAllVisible();

            const total = newJG.length+newJK.length+newKY.length+newGZ.length;
            prog.textContent = '✅ 更新成功！嘉吉'+newJG.length+'家 / 竞争'+newJK.length+'家 / 可用'+newKY.length+'个 / 关注'+newGZ.length+'个';
            showToast('数据更新成功！共'+total+'条');
            setTimeout(() => {
                if(confirm('数据已更新！是否下载更新版HTML文件？\n\n下载后将新文件替换到GitHub，所有人就能看到最新数据。')) {
                    downloadUpdatedHTML();
                }
                closeUploadOverlay();
            }, 1500);
        } catch(err) {
            prog.textContent = '❌ 解析失败：'+err.message;
        }
    };
    reader.readAsArrayBuffer(file);
}

// ===== 导出筛选结果 =====
function exportFiltered() {
    const rows=[];
    const typeNames={jg:'嘉吉工厂',jk:'竞争厂家',ky:'可用',gz:'关注'};
    ['jg','jk','ky','gz'].forEach(type => {
        markers[type].forEach(m => {
            if(layers[type].hasLayer(m)) {
                const d=m._data;
                rows.push({'类别':typeNames[type],'名称':d.n,'关联嘉吉工厂':d.c||'','原料':d.m||'','备注':d.t||'','经度':d.x,'纬度':d.y});
            }
        });
    });
    if(!rows.length) { showToast('没有可导出的数据'); return; }
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'筛选结果');
    XLSX.writeFile(wb,'筛选结果_'+Date.now()+'.xlsx');
    showToast('导出成功！共'+rows.length+'条记录');
}

// ===== Toast =====
function showToast(msg) {
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),3000);
}

// ===== 初始化 =====
applyFilters();
document.addEventListener('click', function(e) {
    if(!e.target.closest('#cargillFilter') && !e.target.closest('#filterSuggestions'))
        document.getElementById('filterSuggestions').style.display='none';
});
</script>
